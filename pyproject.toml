[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sinama"
version = "1.2.0"
description = "Unofficial Python client for the 30nama (hana-api v2) API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DrSaeedHub" }]
requires-python = ">=3.9"
keywords = ["30nama", "sinama", "api", "client", "streaming", "hana-api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/DrSaeedHub/30nama-API"
Documentation = "https://github.com/DrSaeedHub/30nama-API/blob/master/docs/API.md"
Changelog = "https://github.com/DrSaeedHub/30nama-API/blob/master/CHANGELOG.md"
Issues = "https://github.com/DrSaeedHub/30nama-API/issues"

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]
httpx = ["httpx>=0.24"]

[project.scripts]
sinama = "sinama.app:main"

[tool.setuptools]
packages = ["sinama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to the real 30nama API",
    "auth: needs a logged-in session (SINAMA_TOKEN or a saved session file)",
]
