[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sinama"
version = "1.2.0"
description = "Unofficial Python client for the 30nama (hana-api v2) API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]
httpx = ["httpx>=0.24"]

[project.scripts]
sinama = "sinama.app:main"

[tool.setuptools]
packages = ["sinama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to the real 30nama API",
    "auth: needs a logged-in session (SINAMA_TOKEN or a saved session file)",
]
